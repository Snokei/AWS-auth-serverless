service: express-jwt-auth

frameworkVersion: '>=3.0.0'

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  memorySize: 256
  timeout: 10
  httpApi:
    cors: true
    metrics: true
    throttling:
      maxConcurrentRequests: 100
      rateLimit: 50
      burstLimit: 100
  environment:
    NODE_ENV: production
    USERS_TABLE: express-jwt-users
    ITEMS_TABLE: express-jwt-items
    CONNECTIONS_TABLE: SubscriptionsTable
    JWT_SECRET: ${env:JWT_SECRET, 'change_this_secret_in_aws_console_or_ssm'}
    JWT_EXPIRES_IN: 24h
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:Scan
            - dynamodb:Query
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
          Resource:
            - !GetAtt UsersTable.Arn
            - !GetAtt ItemsTable.Arn
            - !GetAtt SubscriptionsTable.Arn
            - !Sub "${SubscriptionsTable.Arn}/index/*"

functions:
  # HTTP API (Express REST server for Auth & Items & REST Notifications)
  api:
    handler: lambda.handler
    events:
      - httpApi: '*'

  # WebSocket API (Question 4 Real-time Notifications)
  websocketNotif:
    handler: src/notificationHandler.handler
    events:
      - websocket:
          route: $connect
      - websocket:
          route: $disconnect
      - websocket:
          route: subscribe
      - websocket:
          route: publish

  # Question 5: Batch Processing Microservice
  batchProcessor:
    handler: src/batchProcessor.handler
    memorySize: 512
    timeout: 60
    events:
      - httpApi:
          path: /batch/process
          method: POST

resources:
  Resources:
    # Question 1: User Auth Table
    UsersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: express-jwt-users
        AttributeDefinitions:
          - AttributeName: email
            AttributeType: S
        KeySchema:
          - AttributeName: email
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST

    # Question 2: Items CRUD Table
    ItemsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: express-jwt-items
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST

    # Question 4: WebSocket Real-Time Notification Subscriptions Table
    SubscriptionsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: SubscriptionsTable
        AttributeDefinitions:
          - AttributeName: connectionId
            AttributeType: S
          - AttributeName: topic
            AttributeType: S
        KeySchema:
          - AttributeName: connectionId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: topic-index
            KeySchema:
              - AttributeName: topic
                KeyType: HASH
            Projection:
              ProjectionType: ALL
        BillingMode: PAY_PER_REQUEST
        TimeToLiveSpecification:
          AttributeName: ttl
          Enabled: true
 