service: express-jwt-auth

frameworkVersion: '>=3.0.0'

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  memorySize: 256
  timeout: 10
  httpApi:
    cors: true
    metrics: true
    throttling:
      maxConcurrentRequests: 100
      rateLimit: 50
      burstLimit: 100
  environment:
    NODE_ENV: production
    USERS_TABLE: express-jwt-users
    ITEMS_TABLE: express-jwt-items
    JWT_SECRET: ${env:JWT_SECRET, 'change_this_secret_in_aws_console_or_ssm'}
    JWT_EXPIRES_IN: 24h
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:Scan
            - dynamodb:Query
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
          Resource:
            - !GetAtt UsersTable.Arn
            - !GetAtt ItemsTable.Arn

functions:
  api:
    handler: lambda.handler
    events:
      - httpApi: '*'

resources:
  Resources:
    UsersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: express-jwt-users
        AttributeDefinitions:
          - AttributeName: email
            AttributeType: S
        KeySchema:
          - AttributeName: email
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST

    ItemsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: express-jwt-items
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST

